# Tooling-only configuration for the TG-Desk CRM backend.
# This is NOT a packaging manifest: dependencies live in requirements.txt and run through
# `python -m uvicorn app.main:app` from the `backend/` directory.

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency injection uses function calls in defaults by design.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # `assert False` accepted in test helpers.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
